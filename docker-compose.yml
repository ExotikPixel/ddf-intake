# No folder links (bind mounts): after a Windows restart Docker can start containers before its links to Ubuntu folders exist.
# On 2026-11-23 that kept the db from starting and showed the app an empty folder. Data lives in Docker volumes and SQL is baked
# into the db image. WARNING: `docker compose down -v` deletes the database, the files and the local backups.
name: ddf-intake

services:
  db:
    build: ./db
    image: ddf-intake-db:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ddf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ddf
    volumes:
      - ddf_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"   # localhost only — for scripts and tests
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ddf -d ddf"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://ddf:${POSTGRES_PASSWORD}@db:5432/ddf
      FILES_DIR: /data/files
    volumes:
      - ddf_files:/data/files
    ports:
      - "127.0.0.1:3000:3000"   # localhost only — the public path is the tunnel
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  ops:
    build: ./ops
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ddf
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ddf
      APP_URL: http://app:3000
      DATA_DIR: /ddf-data
    volumes:
      - ddf_ops:/ddf-data            # backups/ + ops-state/
      - ddf_files:/ddf-data/files
    depends_on:
      db:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:2025.11.1
    profiles: ["public"]        # started by deploy.sh only when TUNNEL_TOKEN is set
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy

volumes:
  ddf_pgdata:
  ddf_files:
  ddf_ops:
